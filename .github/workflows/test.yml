name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.14
      - run: uv sync
      - run: uv run pytest -q
      - name: Schema checks on sample data
        run: |
          uv run scripts/seed.py
          sqlite3 data/fitness.db < scripts/queries.sql > /dev/null
