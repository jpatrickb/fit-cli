[project]
name = "fit-cli"
version = "0.1.0"
description = "A local, agent-driven CLI for logging workouts and runs, building gym templates and tracking progress"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jpatrickb", email = "142933271+jpatrickb@users.noreply.github.com" }
]
keywords = ["fitness", "workout", "strength-training", "running", "cli", "sqlite", "agent"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
requires-python = ">=3.14"
dependencies = [
    "toon-format>=1.1.0",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/jpatrickb/fit-cli"

[project.scripts]
fit = "fit:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fit"   # the package is fit; the distribution is fit-cli

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
